<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pulshen</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* Твой фирменный фиолетовый аскетичный стиль */
        body { background: #0d0b14; color: #e0aaff; font-family: sans-serif; padding: 20px; margin: 0; }
        input { background: #1a152e; border: 1px solid #3c2a6b; color: white; padding: 10px; border-radius: 5px; }
        button { background: #9d4edd; border: none; color: white; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .msg { background: #241942; padding: 8px; margin: 5px 0; border-radius: 8px; max-width: 80%; }
        .my-msg { background: #9d4edd; margin-left: auto; color: white; }
    </style>
</head>
<body>

    <!-- 1. ОКНО ВХОДА -->
    <div id="authScreen" style="text-align: center; margin-top: 100px;">
        <h2>Регистрация Pulshen</h2>
        <input type="text" id="regName" placeholder="Придумай уникальный ник...">
        <button onclick="register()">Войти</button>
    </div>

    <!-- 2. ГЛАВНЫЙ ЭКРАН МЕССЕНДЖЕРА -->
    <div id="appContainer" style="display: none; gap: 20px;">
        <!-- Панель слева: поиск -->
        <div style="width: 30%; border-right: 1px solid #3c2a6b; padding-right: 20px;">
            <input type="text" id="searchName" placeholder="🔍 Найти ник..." style="width: 50%;">
            <button onclick="searchUser()">Найти пользователя</button>
            <div id="chatList" style="margin-top: 20px; cursor: pointer; font-weight: bold;"></div>
        </div>

        <!-- Панель справа: чат -->
        <div style="width: 70%; display: flex; flex-direction: column; height: 80vh;">
            <h3 id="chatHeader">Выберите, кому написать...</h3>
            <div id="msgBox" style="flex-grow: 1; overflow-y: auto; border: 1px solid #3c2a6b; padding: 10px; margin-bottom: 10px;"></div>
            <div>
                <input type="text" id="msgInput" placeholder="Сообщение (макс 300 симв)..." maxlength="300" style="width: 80%;">
                <button onclick="sendMsg()">Послать</button>
            </div>
        </div>
    </div>

    <script>
        // Использоватьlocalhost напрямую нельзя, но "localhost" вместо цифр решает проблему блокировки Гитхаба!
        const ws = new WebSocket("ws://localhost:8000/ws");
        let myName = "", activeChatWith = "";

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (data.type === "error") alert(data.message);
            
            if (data.type === "auth_ok") {
                myName = data.username;
                localStorage.setItem("saved_username", myName); // Сохраняем в память
                document.getElementById("authScreen").style.display = "none";
                document.getElementById("appContainer").style.display = "flex";
            }
            if (data.type === "search_result") {
                if (data.found) addChatToList(data.username);
                else alert("Пользователь оффлайн или не существует!");
            }
            if (data.type === "msg") {
                if (data.from === activeChatWith || (data.from === myName && activeChatWith !== "")) {
                    const div = document.createElement("div");
                    div.className = "msg" + (data.from === myName ? " my-msg" : "");
                    div.innerText = `${data.from}: ${data.text}`;
                    document.getElementById("msgBox").appendChild(div);
                }
            }
        };

        ws.onopen = function() {
            const savedName = localStorage.getItem("saved_username");
            if (savedName) {
                ws.send(JSON.stringify({ action: "register", username: savedName }));
            }
        };

        function register() {
            const name = document.getElementById("regName").value.trim();
            if (name) ws.send(JSON.stringify({ action: "register", username: name }));
        }
        function searchUser() {
            const name = document.getElementById("searchName").value.trim();
            if (name === myName) return alert("Нельзя искать себя!");
            if (name) ws.send(JSON.stringify({ action: "search", username: name }));
        }

        function addChatToList(username) {
            const list = document.getElementById("chatList");
            if (document.getElementById(`chat-${username}`)) return;
            const item = document.createElement("div");
            item.id = `chat-${username}`;
            item.innerText = `@${username}`;
            item.onclick = function() {
                activeChatWith = username;
                document.getElementById("chatHeader").innerText = `Чат с @${username}`;
                document.getElementById("msgBox").innerHTML = "";
            };
            list.appendChild(item);
        }

        function sendMsg() {
            const input = document.getElementById("msgInput");
            if (input.value.trim() && activeChatWith) {
                ws.send(JSON.stringify({ action: "message", to: activeChatWith, text: input.value.trim() }));
                input.value = "";
            }
        }
    </script>
</body>
</html>
